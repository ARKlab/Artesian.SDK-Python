[project]
name = "artesian-sdk"
dynamic = ["version"]
description = "Library provides read access to the Artesian API"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["Artesian"]
authors = [
  {name = "ARK Lab", email = "arklab@ark-energy.eu" }
]
maintainers = [
  {name = "ARK Lab", email = "arklab@ark-energy.eu" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
    "requests~=2.27",
    "six~=1.16",
    "jsons~=1.6,>=1.6.1",
    "python-dateutil~=2.8,>=2.8.2"
]

[project.urls]
"Homepage" = "https://www.artesian.cloud/"
"Source" = "https://github.com/ARKlab/Artesian.SDK-Python"

[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/Artesian/_version.py"
local_scheme = "dirty-tag"

[tool.pytest.ini_options]
python_files = "Test*.py"
testpaths = [
    "tests"
]
addopts = "--doctest-modules --junitxml=junit/test-results.xml --cov --cov-report=term-missing --cov-report=xml --cov-report=html"

[tool.uv]
required-version = "==0.12.19"

[dependency-groups]
dev = [
    {include-group = "test"},
    "pyrefly==1.3.1",
    "ruff==0.16.9",
    "twine>=6.1.0",
]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "responses~=0.22",
]

[tool.ruff]
target-version = "py314"
line-length = 120
include = ["*.py", "*.pyi"]
extend-exclude = ["src/Artesian/_version.py", "samples"]

[tool.ruff.lint]
extend-select = ["ANN"]
# ponytail: Preserve public module names, exception behavior, and jsons-sensitive typing; migrate remaining legacy rules by file.
ignore = [
    "BLE001", "I001", "N999",
    "PLR1730", "RET501", "RUF022",
    "TRY002", "UP006", "UP030", "UP032", "UP035", "UP037",
    "UP045", "UP046", # UP046 needs Python 3.12 syntax; this package supports 3.11.
]

[tool.ruff.lint.per-file-ignores]
# jsons accepts dynamically typed plugin keyword arguments at this adapter boundary.
"src/Artesian/_ClientsExecutor/ArtesianJsonSerializer.py" = ["ANN401"]
# These sentinel datetimes are immutable and intentionally shared as field defaults.
"src/Artesian/MarketData/_Dto/CurveRangeEntity.py" = ["RUF009"]
# Time-series test data deliberately uses naive timestamps in the source timezone.
"tests/TestMarketDataDeleteData.py" = ["DTZ001"]
"tests/TestMarketDataService.py" = ["DTZ001"]
"tests/TestMarketDataUpsertData.py" = ["DTZ001"]
# These tests exercise nested context lifetimes and execute checked-in test/workflow code.
"tests/TestClientErrorHandling.py" = ["SIM117"]
"tests/TestRequestExecutor.py" = ["SIM117"]
"tests/TestGMEPO.py" = ["S102"]
"tests/TestPublishingWorkflow.py" = ["S102", "SIM117"]
# The request decorators forward dynamically typed unittest instances and need the module, not the exported class.
"tests/helpers.py" = ["ANN401", "PLR0402"]

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = ["src/Artesian/_version.py"]
search-path = ["src", "."]
python-version = "3.14"

[tool.coverage.run]
branch = true
relative_files = true
source = ["Artesian"]
omit = ["src/Artesian/_version.py"]

[tool.coverage.paths]
source = ["src", "*/src", '*\src']

[tool.coverage.report]
show_missing = true
