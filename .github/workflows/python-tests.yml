name: "Artesian SDK Python"

on:
  push:
    branches: [master]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint / Type Check / Package
  # ---------------------------------------------------------------------------

  quality:
    name: "Ruff / Pyrefly / Package"
    runs-on: ubuntu-latest

    # These artifacts are not published; preview tags are not PEP 440 versions.
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: |
          uv run --no-sync ruff check --output-format github .
          uv run --no-sync ruff format --check .

      - name: Run Pyrefly
        run: uv run --no-sync pyrefly check --output-format github

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run --no-sync twine check dist/*

  # ---------------------------------------------------------------------------
  # Build / Test
  # ---------------------------------------------------------------------------

  build:
    name: "build"
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up uv / Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          export SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}b${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          uv sync --locked --no-dev --group test

      - name: Test Pytest
        run: |
          uv run --no-sync pytest --junitxml=junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-build-${{ matrix.python-version }}-${{ matrix.os }}
          path: junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml

      - name: Upload build coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-build-${{ matrix.python-version }}-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml

  # ---------------------------------------------------------------------------
  # Test Report
  #
  # Consolidates test results from all jobs (build and build-preview)
  # into a single report.
  # ---------------------------------------------------------------------------

  test-report:
    name: "Test Report"
    runs-on: ubuntu-latest
    needs:
      - build
      - build-preview

    if: always()

    permissions:
      contents: read
      checks: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Download test result artifacts"
        uses: actions/download-artifact@v8
        if: always()
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: "Test Report"
        uses: dorny/test-reporter@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Python Tests
          path: "test-results/**/*.xml"
          reporter: java-junit
          fail-on-error: "true"
          use-actions-summary: "true"

  # ---------------------------------------------------------------------------
  # Code Coverage
  #
  # Merge coverage from all Python/OS combinations of the same commit.
  # Preview builds test a different merge commit and are kept separate.
  # ---------------------------------------------------------------------------

  coverage-report:
    name: "Code Coverage"
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
    needs:
      - build

    if: ${{ !cancelled() && needs.build.result == 'success' }}

    permissions:
      contents: read
      code-quality: write
      pull-requests: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: "Install coverage tooling"
        run: uv sync --locked --no-dev --group test

      - name: "Download coverage artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-build-*
          path: coverage

      - name: "Create code coverage report"
        shell: bash
        run: |
          uv run --no-sync coverage combine coverage/coverage-build-*/.coverage
          uv run --no-sync coverage xml
          uv run --no-sync coverage html
          uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload combined coverage"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: |
            coverage.xml
            htmlcov/

      - name: "Upload coverage to GitHub"
        if: >
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest

  # ---------------------------------------------------------------------------
  # Build Stable
  #
  # Tag:
  #   v4.3.0
  #
  # Python package version:
  #   4.3.0
  #
  # Must originate from:
  #   master
  # ---------------------------------------------------------------------------

  build-stable:
    name: "Build Stable"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
      artifact-digest: ${{ steps.distributions.outputs.artifact-digest }}
      source-sha: ${{ steps.source.outputs.sha }}
      wheel-sha: ${{ steps.hashes.outputs.wheel-sha }}
      sdist-sha: ${{ steps.hashes.outputs.sdist-sha }}
    needs:
      - quality
      - build

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, 'a') &&
      !contains(github.ref_name, 'b')

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Validate GA release tag"
        shell: bash
        run: bash .github/workflows/validate_tag.sh "$GITHUB_REF_NAME" ga

      - name: "Validate release commit is contained in master"
        shell: bash
        run: bash .github/workflows/validate_branch.sh "master"

      - name: "Record release source"
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: "Build package"
        shell: bash
        run: |
          echo "Building GA package: ${GITHUB_REF_NAME#v}"
          uv build

      - name: "Check release metadata"
        run: |
          uv sync --locked
          uv run --no-sync twine check dist/*

      - name: "Record distribution hashes"
        id: hashes
        run: |
          echo "Source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/*.whl dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"
          echo "wheel-sha=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist-sha=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: "Upload release distributions"
        id: distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # Only this job can obtain a publishing/signing identity. Never execute build
  # output or check out PR code here; the pypi environment requires approval.
  publish:
    name: "Attest and publish to PyPI"
    runs-on: ubuntu-latest
    needs: [build-stable, build-beta, build-preview]
    if: >-
      ${{
        !cancelled() && github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') &&
        (
          (needs.build-stable.result == 'success' && needs.build-beta.result == 'skipped' && needs.build-preview.result == 'skipped') ||
          (needs.build-beta.result == 'success' && needs.build-stable.result == 'skipped' && needs.build-preview.result == 'skipped') ||
          (needs.build-preview.result == 'success' && needs.build-stable.result == 'skipped' && needs.build-beta.result == 'skipped')
        )
      }}
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ needs.build-stable.outputs.source-sha || needs.build-beta.outputs.source-sha || needs.build-preview.outputs.source-sha }}
      ARTIFACT_ID: ${{ needs.build-stable.outputs.artifact-id || needs.build-beta.outputs.artifact-id || needs.build-preview.outputs.artifact-id }}
      ARTIFACT_DIGEST: ${{ needs.build-stable.outputs.artifact-digest || needs.build-beta.outputs.artifact-digest || needs.build-preview.outputs.artifact-digest }}
      WHEEL_SHA: ${{ needs.build-stable.outputs.wheel-sha || needs.build-beta.outputs.wheel-sha || needs.build-preview.outputs.wheel-sha }}
      SDIST_SHA: ${{ needs.build-stable.outputs.sdist-sha || needs.build-beta.outputs.sdist-sha || needs.build-preview.outputs.sdist-sha }}

    steps:
      - name: "Download validated distributions"
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: dist
          merge-multiple: true

      - name: "Validate distribution identity"
        id: identity
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:b(\d+)|a(\d+)\.(\d+))?", tag)
          if not match:
              raise SystemExit("Invalid release tag")
          version, beta, pr, iteration = match.groups()
          version = ".".join(str(int(part)) for part in version.split("."))
          if beta:
              version += f"b{int(beta)}"
          elif pr:
              version += f"a{int(pr)}.post{int(iteration)}"
          expected = {
              f"artesian_sdk-{version}-py3-none-any.whl": os.environ["WHEEL_SHA"],
              f"artesian_sdk-{version}.tar.gz": os.environ["SDIST_SHA"],
          }
          paths = list(Path("dist").iterdir())
          if {path.name for path in paths} != set(expected):
              raise SystemExit("Expected only the release wheel and sdist; no supplied attestations or code")
          for path in paths:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Not a regular distribution: {path.name}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected[path.name]:
                  raise SystemExit(f"Distribution changed since validation: {path.name}")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_SHA"]):
              raise SystemExit("Missing or invalid build source SHA")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ["ARTIFACT_DIGEST"]):
              raise SystemExit("Missing or invalid artifact digest")
          if not os.environ["ARTIFACT_ID"].isdigit():
              raise SystemExit("Missing artifact ID")
          record = {
              "version": version,
              "source_sha": os.environ["SOURCE_SHA"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifact_id": os.environ["ARTIFACT_ID"],
              "artifact_digest": os.environ["ARTIFACT_DIGEST"],
              "files": expected,
          }
          Path("release.json").write_text(json.dumps(record, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Release identity\n\n```json\n" + json.dumps(record, indent=2) + "\n```\n")

      - name: "Set up pinned uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false

      - name: "Generate PEP 740 publish attestations"
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            dist/*.whl
            dist/*.tar.gz

      - name: "Require matching attestations"
        shell: python
        run: |
          import base64
          import hashlib
          import json
          from pathlib import Path

          files = json.loads(Path("release.json").read_text())["files"]
          expected = set(files) | {name + ".publish.attestation" for name in files}
          if {path.name for path in Path("dist").iterdir()} != expected:
              raise SystemExit("Every distribution must have exactly one publish attestation")
          for name, digest in files.items():
              if hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"Distribution changed during signing: {name}")
              attestation = json.loads((Path("dist") / (name + ".publish.attestation")).read_text())
              statement = json.loads(base64.b64decode(attestation["envelope"]["statement"], validate=True))
              if (
                  attestation["version"] != 1
                  or not attestation["envelope"]["signature"]
                  or not attestation["verification_material"]["certificate"]
                  or not attestation["verification_material"]["transparency_entries"]
                  or statement["_type"] != "https://in-toto.io/Statement/v1"
                  or statement["predicateType"] != "https://docs.pypi.org/attestations/publish/v1"
                  or statement["subject"] != [{"name": name, "digest": {"sha256": digest}}]
              ):
                  raise SystemExit(f"Invalid or mismatched publish attestation: {name}")

      - name: "Publish with required Trusted Publishing"
        run: >-
          env -u UV_PUBLISH_TOKEN -u UV_PUBLISH_USERNAME -u UV_PUBLISH_PASSWORD
          -u UV_PUBLISH_NO_ATTESTATIONS -u UV_PUBLISH_INDEX -u UV_PUBLISH_CHECK_URL
          uv publish --no-config --trusted-publishing always --keyring-provider disabled
          --publish-url https://upload.pypi.org/legacy/ dist/*.whl dist/*.tar.gz

      - name: "Verify PyPI attestation availability"
        shell: python
        run: |
          import base64
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          record = json.loads(Path("release.json").read_text())
          for name, digest in record["files"].items():
              url = "https://pypi.org/integrity/artesian-sdk/" + "/".join(
                  quote(part, safe="") for part in (record["version"], name)
              ) + "/provenance"
              for attempt in range(6):
                  try:
                      request = Request(url, headers={"Accept": "application/vnd.pypi.integrity.v1+json"})
                      with urlopen(request, timeout=30) as response:
                          provenance = json.load(response)
                      if provenance["version"] != 1:
                          raise SystemExit("Unsupported PyPI provenance version")
                      found = False
                      for bundle in provenance["attestation_bundles"]:
                          publisher = bundle["publisher"]
                          if (
                              publisher["kind"] != "GitHub"
                              or publisher["repository"] != "ARKlab/Artesian.SDK-Python"
                              or publisher["workflow"] != "python-tests.yml"
                              or publisher["environment"] != "pypi"
                          ):
                              continue
                          for attestation in bundle["attestations"]:
                              statement = json.loads(base64.b64decode(attestation["envelope"]["statement"], validate=True))
                              if (
                                  attestation["version"] == 1
                                  and statement["_type"] == "https://in-toto.io/Statement/v1"
                                  and statement["predicateType"] == "https://docs.pypi.org/attestations/publish/v1"
                                  and statement["subject"] == [{"name": name, "digest": {"sha256": digest}}]
                              ):
                                  found = True
                      if found:
                          break
                  except HTTPError as error:
                      if error.code not in (404, 429, 500, 502, 503, 504):
                          raise
                  except (URLError, TimeoutError):
                      pass
                  if attempt < 5:
                      time.sleep(10)
              else:
                  raise SystemExit(f"PyPI has no matching publish attestation for {name}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"- Verified PyPI publisher and SHA256 for [{name}]({url})\n")

      - name: "Retain release identity and signed distributions"
        if: ${{ always() && steps.identity.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: attested-release-${{ github.run_attempt }}
          path: |
            dist/
            release.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build Beta
  #
  # Tag:
  #   v4.3.0b1
  #   v4.3.0b2
  #
  # Python package version:
  #   4.3.0b1
  #   4.3.0b2
  #
  # Must originate from:
  #   develop-beta
  #
  # Beta version MUST be the next minor version after
  # the latest GA version on master.
  #
  # Example:
  #
  #   master       = v4.2.0
  #   develop-beta = v4.3.0b1
  #
  # ---------------------------------------------------------------------------

  build-beta:
    name: "Build Beta"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
      artifact-digest: ${{ steps.distributions.outputs.artifact-digest }}
      source-sha: ${{ steps.source.outputs.sha }}
      wheel-sha: ${{ steps.hashes.outputs.wheel-sha }}
      sdist-sha: ${{ steps.hashes.outputs.sdist-sha }}
    needs:
      - quality
      - build

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, 'b')

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Validate Beta release tag"
        shell: bash
        run: bash .github/workflows/validate_tag.sh "$GITHUB_REF_NAME" beta

      - name: "Validate release commit is contained in develop-beta"
        shell: bash
        run: bash .github/workflows/validate_branch.sh "develop-beta"

      - name: "Validate next minor version"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin master --tags

          MASTER_VERSION=$(
            git tag --merged origin/master --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 |
            sed 's/^v//'
          )

          BETA_VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)b[0-9]+$/\1/')

          echo "Master GA version: $MASTER_VERSION"
          echo "Beta version:      $BETA_VERSION"

          if [[ -z "$MASTER_VERSION" ]]; then
            echo "::error::Could not determine the latest GA version on master."
            exit 1
          fi

          MASTER_MAJOR=$(echo "$MASTER_VERSION" | cut -d. -f1)
          MASTER_MINOR=$(echo "$MASTER_VERSION" | cut -d. -f2)

          BETA_MAJOR=$(echo "$BETA_VERSION" | cut -d. -f1)
          BETA_MINOR=$(echo "$BETA_VERSION" | cut -d. -f2)

          EXPECTED_MAJOR="$MASTER_MAJOR"
          EXPECTED_MINOR="$((MASTER_MINOR + 1))"

          if [[ "$BETA_MAJOR" != "$EXPECTED_MAJOR" ||
                "$BETA_MINOR" != "$EXPECTED_MINOR" ]]; then
            echo "::error::Beta version $BETA_VERSION is not the next minor version after master GA $MASTER_VERSION."
            echo "::error::Expected: ${EXPECTED_MAJOR}.${EXPECTED_MINOR}.0bN"
            exit 1
          fi

          echo "Beta version $BETA_VERSION is the next minor version after master GA $MASTER_VERSION."

      - name: "Record release source"
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: "Build package"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}b${BASH_REMATCH[2]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          uv build

      - name: "Check release metadata"
        run: |
          uv sync --locked
          uv run --no-sync twine check dist/*

      - name: "Record distribution hashes"
        id: hashes
        run: |
          echo "Source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/*.whl dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"
          echo "wheel-sha=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist-sha=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: "Upload release distributions"
        id: distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build PR Preview
  #
  # Tag:
  #   v4.3.0a69.1
  #   v4.3.0a69.2
  #
  # Python package version:
  #   4.3.0a69.post1
  #   4.3.0a69.post2
  #
  # Where:
  #   4.3.0 = latest GA version on master
  #   69    = PR number
  #   1 / 2 = preview iteration
  #
  # The PR Preview version MUST match the latest GA version on master.
  # The PR must be based on the current master.
  # ---------------------------------------------------------------------------

  build-preview:
    name: "Build PR Preview"
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
      artifact-digest: ${{ steps.distributions.outputs.artifact-digest }}
      source-sha: ${{ steps.source.outputs.sha }}
      wheel-sha: ${{ steps.hashes.outputs.wheel-sha }}
      sdist-sha: ${{ steps.hashes.outputs.sdist-sha }}

    permissions:
      contents: read

    needs:
      - quality
      - build

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, 'a')

    steps:
      - name: "Extract PR number"
        id: pr
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+a([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Invalid PR preview tag: $TAG"
            exit 1
          fi

          PR_NUMBER="${BASH_REMATCH[1]}"
          ITERATION="${BASH_REMATCH[2]}"

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "iteration=$ITERATION" >> "$GITHUB_OUTPUT"

          echo "PR number: $PR_NUMBER"
          echo "Iteration: $ITERATION"

      - name: "Checkout merged PR head"
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          fetch-depth: 0

      - name: "Validate PR Preview tag"
        shell: bash
        run: bash .github/workflows/validate_tag.sh "$GITHUB_REF_NAME" preview

      - name: "Validate PR is based on current master"
        shell: bash
        run: |
          git fetch origin master

          CURRENT_MASTER=$(git rev-parse origin/master)
          MERGE_PARENT=$(git rev-parse HEAD^1)

          echo "Current master: $CURRENT_MASTER"
          echo "Merge parent:   $MERGE_PARENT"

          if [[ "$MERGE_PARENT" != "$CURRENT_MASTER" ]]; then
            echo "::error::PR Preview is not based on the current master."
            exit 1
          fi

          echo "PR Preview is based on master."

      - name: "Record release source"
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Validate preview version"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin master --tags

          MASTER_VERSION=$(
            git tag --merged origin/master --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 |
            sed 's/^v//'
          )

          PREVIEW_VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)a[0-9]+\.[0-9]+$/\1/')

          echo "Master GA version: $MASTER_VERSION"
          echo "Preview version:   $PREVIEW_VERSION"

          if [[ -z "$MASTER_VERSION" ]]; then
            echo "::error::Could not determine the latest GA version on master."
            exit 1
          fi

          if [[ "$PREVIEW_VERSION" != "$MASTER_VERSION" ]]; then
            echo "::error::PR Preview version $PREVIEW_VERSION does not match current master GA version $MASTER_VERSION."
            exit 1
          fi

          echo "PR Preview version matches current master GA version: $MASTER_VERSION"

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: "Install dependencies"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION:-not-set}"

          uv sync --locked

      - name: "Run Ruff and Pyrefly"
        run: |
          uv run --no-sync ruff check --output-format github .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyrefly check --output-format github

      - name: "Test Pytest"
        run: |
          uv run --no-sync pytest --junitxml=junit/test-results-preview.xml

      - name: "Upload pytest test results"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-preview
          path: junit/test-results-preview.xml

      - name: "Upload preview coverage"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-preview
          path: coverage.xml

      - name: "Build package"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          uv build

      - name: "Check release metadata"
        run: uv run --no-sync twine check dist/*

      - name: "Record distribution hashes"
        id: hashes
        run: |
          echo "Source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/*.whl dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"
          echo "wheel-sha=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist-sha=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: "Upload release distributions"
        id: distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
