name: "Artesian SDK Python"

on:
  push:
    branches: [master]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Package
  # ---------------------------------------------------------------------------

  quality:
    name: "Package"
    runs-on: ubuntu-latest

    # These artifacts are not published; preview tags are not PEP 440 versions.
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run --no-sync twine check dist/*

  # ---------------------------------------------------------------------------
  # Build / Test
  # ---------------------------------------------------------------------------

  build:
    name: "build"
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up uv / Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          export SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}b${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          uv sync --locked

      - name: Run Ruff and Pyrefly
        shell: bash
        run: |
          uv run --no-sync ruff check --target-version "py${PYTHON_VERSION//./}" --output-format github .
          uv run --no-sync ruff format --check --target-version "py${PYTHON_VERSION//./}" .
          uv run --no-sync pyrefly check --python-version "$PYTHON_VERSION" --output-format github
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Test Pytest
        run: |
          uv run --no-sync pytest --junitxml=junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-build-${{ matrix.python-version }}-${{ matrix.os }}
          path: junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml

      - name: Upload build coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-build-${{ matrix.python-version }}-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml

  # ---------------------------------------------------------------------------
  # Test Report
  #
  # Consolidates test results from all jobs (build and build-preview)
  # into a single report.
  # ---------------------------------------------------------------------------

  test-report:
    name: "Test Report"
    runs-on: ubuntu-latest
    needs:
      - build
      - build-preview

    if: always()

    permissions:
      contents: read
      checks: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Download test result artifacts"
        uses: actions/download-artifact@v8
        if: always()
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: "Test Report"
        uses: dorny/test-reporter@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Python Tests
          path: "test-results/**/*.xml"
          reporter: java-junit
          fail-on-error: "true"
          use-actions-summary: "true"

  # ---------------------------------------------------------------------------
  # Code Coverage
  #
  # Merge coverage from all Python/OS combinations of the same commit.
  # Preview builds run separately on the tagged commit.
  # ---------------------------------------------------------------------------

  coverage-report:
    name: "Code Coverage"
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
    needs:
      - build

    if: ${{ !cancelled() && needs.build.result == 'success' }}

    permissions:
      contents: read
      code-quality: write
      pull-requests: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: "Install coverage tooling"
        run: uv sync --locked --no-dev --group test

      - name: "Download coverage artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-build-*
          path: coverage

      - name: "Create code coverage report"
        shell: bash
        run: |
          uv run --no-sync coverage combine coverage/coverage-build-*/.coverage
          uv run --no-sync coverage xml
          uv run --no-sync coverage html
          uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload combined coverage"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: |
            coverage.xml
            htmlcov/

      - name: "Upload coverage to GitHub"
        if: >
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest

  # ---------------------------------------------------------------------------
  # Build Stable
  #
  # Tag:
  #   v4.3.0
  #
  # Python package version:
  #   4.3.0
  #
  # Must originate from:
  #   master
  # ---------------------------------------------------------------------------

  build-stable:
    name: "Build Stable"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - quality
      - build

    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, 'a') &&
      !contains(github.ref_name, 'b')

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: "Validate GA release tag"
        shell: bash
        run: bash .github/workflows/validate_tag.sh "$GITHUB_REF_NAME" ga

      - name: "Validate release commit is contained in master"
        shell: bash
        run: bash .github/workflows/validate_branch.sh "master"

      - name: "Record release source"
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: "Build package"
        shell: bash
        run: |
          echo "Building GA package: ${GITHUB_REF_NAME#v}"
          uv build

      - name: "Check release metadata"
        run: |
          uv sync --locked
          uv run --no-sync twine check dist/*

      - name: "Record distribution hashes"
        run: |
          echo "Source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/*.whl dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload release distributions"
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # See https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
  # Only this job can obtain a publishing identity; do not check out or build here.
  publish:
    name: "Attest and publish to PyPI"
    runs-on: ubuntu-latest
    needs: [test-report, coverage-report, build-stable, build-beta, build-preview]
    if: >-
      ${{
        !cancelled() && !failure() &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        startsWith(github.ref, 'refs/tags/v') &&
        needs.test-report.result == 'success' &&
        needs.coverage-report.result == 'success' &&
        (needs.build-stable.result == 'success' ||
         needs.build-beta.result == 'success' ||
         needs.build-preview.result == 'success')
      }}
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: "Download release distributions"
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: "Check release filenames"
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:b(\d+)|a(\d+)\.(\d+))?", os.environ["GITHUB_REF_NAME"])
          if not match:
              raise SystemExit("Invalid release tag")
          base, beta, pr, iteration = match.groups()
          version = ".".join(str(int(part)) for part in base.split("."))
          if beta:
              version += f"b{int(beta)}"
          elif pr:
              version += f"a{int(pr)}.post{int(iteration)}"
          expected = {f"artesian_sdk-{version}-py3-none-any.whl", f"artesian_sdk-{version}.tar.gz"}
          if {path.name for path in Path("dist").iterdir()} != expected:
              raise SystemExit("Release distributions do not match the tag")

      - name: "Set up pinned uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: "Generate PEP 740 publish attestations"
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            dist/*.whl
            dist/*.tar.gz

      - name: "Publish with required Trusted Publishing"
        run: uv publish --no-config --trusted-publishing always --publish-url https://upload.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # Build Beta
  #
  # Tag:
  #   v4.3.0b1
  #   v4.3.0b2
  #
  # Python package version:
  #   4.3.0b1
  #   4.3.0b2
  #
  # Must originate from:
  #   develop-beta
  #
  # Beta version MUST be the next minor version after
  # the latest GA version on master.
  #
  # Example:
  #
  #   master       = v4.2.0
  #   develop-beta = v4.3.0b1
  #
  # ---------------------------------------------------------------------------

  build-beta:
    name: "Build Beta"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - quality
      - build

    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, 'b')

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: "Validate Beta release tag"
        shell: bash
        run: bash .github/workflows/validate_tag.sh "$GITHUB_REF_NAME" beta

      - name: "Validate release commit is contained in develop-beta"
        shell: bash
        run: bash .github/workflows/validate_branch.sh "develop-beta"

      - name: "Validate next minor version"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin master --tags

          MASTER_VERSION=$(
            git tag --merged origin/master --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 |
            sed 's/^v//'
          )

          BETA_VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)b[0-9]+$/\1/')

          echo "Master GA version: $MASTER_VERSION"
          echo "Beta version:      $BETA_VERSION"

          if [[ -z "$MASTER_VERSION" ]]; then
            echo "::error::Could not determine the latest GA version on master."
            exit 1
          fi

          MASTER_MAJOR=$(echo "$MASTER_VERSION" | cut -d. -f1)
          MASTER_MINOR=$(echo "$MASTER_VERSION" | cut -d. -f2)

          BETA_MAJOR=$(echo "$BETA_VERSION" | cut -d. -f1)
          BETA_MINOR=$(echo "$BETA_VERSION" | cut -d. -f2)

          EXPECTED_MAJOR="$MASTER_MAJOR"
          EXPECTED_MINOR="$((MASTER_MINOR + 1))"

          if [[ "$BETA_MAJOR" != "$EXPECTED_MAJOR" ||
                "$BETA_MINOR" != "$EXPECTED_MINOR" ]]; then
            echo "::error::Beta version $BETA_VERSION is not the next minor version after master GA $MASTER_VERSION."
            echo "::error::Expected: ${EXPECTED_MAJOR}.${EXPECTED_MINOR}.0bN"
            exit 1
          fi

          echo "Beta version $BETA_VERSION is the next minor version after master GA $MASTER_VERSION."

      - name: "Record release source"
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: "Build package"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}b${BASH_REMATCH[2]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          uv build

      - name: "Check release metadata"
        run: |
          uv sync --locked
          uv run --no-sync twine check dist/*

      - name: "Record distribution hashes"
        run: |
          echo "Source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/*.whl dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload release distributions"
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build PR Preview
  #
  # Tag:
  #   v4.3.0a69.1
  #   v4.3.0a69.2
  #
  # Python package version:
  #   4.3.0a69.post1
  #   4.3.0a69.post2
  #
  # Where:
  #   4.3.0 = latest GA version on master
  #   69    = PR number
  #   1 / 2 = preview iteration
  #
  # The PR Preview version MUST match the latest GA version on master.
  # The tagged commit must contain the current master.
  # ---------------------------------------------------------------------------

  build-preview:
    name: "Build PR Preview"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs:
      - quality
      - build

    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, 'a')

    steps:
      - name: "Checkout tagged commit"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: "Validate PR Preview tag"
        shell: bash
        run: bash .github/workflows/validate_tag.sh "$GITHUB_REF_NAME" preview

      - name: "Validate preview source"
        shell: bash
        run: |
          git fetch origin master

          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::PR Preview tag does not contain the current master."
            exit 1
          fi

          PR_NUMBER="${GITHUB_REF_NAME#*a}"
          PR_NUMBER="${PR_NUMBER%%.*}"
          git fetch origin "refs/pull/$PR_NUMBER/head"

          if git merge-base --is-ancestor HEAD origin/master ||
             [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD^{commit})" ]]; then
            echo "::error::PR Preview tag must point to the unmerged head of PR $PR_NUMBER."
            exit 1
          fi

      - name: "Record release source"
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Validate preview version"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin master --tags

          MASTER_VERSION=$(
            git tag --merged origin/master --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 |
            sed 's/^v//'
          )

          PREVIEW_VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)a[0-9]+\.[0-9]+$/\1/')

          echo "Master GA version: $MASTER_VERSION"
          echo "Preview version:   $PREVIEW_VERSION"

          if [[ -z "$MASTER_VERSION" ]]; then
            echo "::error::Could not determine the latest GA version on master."
            exit 1
          fi

          if [[ "$PREVIEW_VERSION" != "$MASTER_VERSION" ]]; then
            echo "::error::PR Preview version $PREVIEW_VERSION does not match current master GA version $MASTER_VERSION."
            exit 1
          fi

          echo "PR Preview version matches current master GA version: $MASTER_VERSION"

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: "Install dependencies"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION:-not-set}"

          uv sync --locked

      - name: "Run Ruff and Pyrefly"
        run: |
          uv run --no-sync ruff check --output-format github .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyrefly check --output-format github

      - name: "Test Pytest"
        run: |
          uv run --no-sync pytest --junitxml=junit/test-results-preview.xml

      - name: "Upload pytest test results"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-preview
          path: junit/test-results-preview.xml

      - name: "Upload preview coverage"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-preview
          path: coverage.xml

      - name: "Build package"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          uv build

      - name: "Check release metadata"
        run: uv run --no-sync twine check dist/*

      - name: "Record distribution hashes"
        run: |
          echo "Source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/*.whl dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload release distributions"
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
