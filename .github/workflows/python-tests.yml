# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions

name: Artesian SDK Python

permissions:
  contents: read

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Pyright
  # ---------------------------------------------------------------------------

  pyright:
    name: pyright
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          export SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0"

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$SETUPTOOLS_SCM_PRETEND_VERSION"

          pip install --no-build-isolation -e ".[dev]"

      - name: Run Pyright
        uses: jordemort/action-pyright@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          lib:
          level: warning
          filter_mode: file

  # ---------------------------------------------------------------------------
  # Build / Test
  # ---------------------------------------------------------------------------

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          TAG="${GITHUB_REF_NAME}"

          export SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}b${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          pip install -e ".[dev]"

      - name: Run flake8
        run: |
          flake8 .

      - name: Test Pytest
        run: |
          pytest --junitxml=junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml
        if: ${{ always() }}

  # ---------------------------------------------------------------------------
  # Publish Stable
  #
  # Tag:
  #   v4.3.0
  #
  # Python package version:
  #   4.3.0
  #
  # Must originate from:
  #   master
  # ---------------------------------------------------------------------------

  publish-stable:
    name: "Publish Stable"
    runs-on: ubuntu-latest
    needs: [pyright, build]

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, 'a') &&
      !contains(github.ref_name, 'b')

    steps:
      - name: "Validate GA release tag"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid GA release tag: $TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          echo "Valid GA release tag: $TAG"

      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Validate tag originates from master"
        shell: bash
        run: |
          git fetch origin master

          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          echo "Tag:        $GITHUB_REF_NAME"
          echo "Tag commit: $TAG_COMMIT"
          echo "Master:     $(git rev-parse origin/master)"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/master"; then
            echo "::error::Release tag $GITHUB_REF_NAME does not point to a commit contained in master."
            exit 1
          fi

          echo "Release commit is contained in master."

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: "Build package"
        shell: bash
        run: |
          echo "Building GA package: ${GITHUB_REF_NAME#v}"
          python -m build

      - name: "Publish package"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish Beta
  #
  # Tag:
  #   v4.3.0b1
  #   v4.3.0b2
  #
  # Python package version:
  #   4.3.0b1
  #   4.3.0b2
  #
  # Must originate from:
  #   develop-beta
  #
  # Beta version MUST be the next minor version after
  # the latest GA version on master.
  #
  # Example:
  #
  #   master       = v4.2.0
  #   develop-beta = v4.3.0b1
  #
  # ---------------------------------------------------------------------------

  publish-beta:
    name: "Publish Beta"
    runs-on: ubuntu-latest
    needs: [pyright, build]

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, 'b')

    steps:
      - name: "Validate Beta release tag"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "::error::Invalid Beta release tag: $TAG"
            echo "Expected format: vX.Y.ZbN"
            exit 1
          fi

          echo "Valid Beta release tag: $TAG"

      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Validate tag originates from develop-beta"
        shell: bash
        run: |
          git fetch origin develop-beta

          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          echo "Tag:        $GITHUB_REF_NAME"
          echo "Tag commit: $TAG_COMMIT"
          echo "Develop-beta: $(git rev-parse origin/develop-beta)"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/develop-beta"; then
            echo "::error::Beta release tag does not point to a commit contained in develop-beta."
            exit 1
          fi

          echo "Release commit is contained in develop-beta."

      - name: "Validate next minor version"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin master --tags

          MASTER_VERSION=$(
            git tag --merged origin/master --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 |
            sed 's/^v//'
          )

          BETA_VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)b[0-9]+$/\1/')

          echo "Master GA version: $MASTER_VERSION"
          echo "Beta version:      $BETA_VERSION"

          if [[ -z "$MASTER_VERSION" ]]; then
            echo "::error::Could not determine the latest GA version on master."
            exit 1
          fi

          MASTER_MAJOR=$(echo "$MASTER_VERSION" | cut -d. -f1)
          MASTER_MINOR=$(echo "$MASTER_VERSION" | cut -d. -f2)

          BETA_MAJOR=$(echo "$BETA_VERSION" | cut -d. -f1)
          BETA_MINOR=$(echo "$BETA_VERSION" | cut -d. -f2)

          EXPECTED_MAJOR="$MASTER_MAJOR"
          EXPECTED_MINOR="$((MASTER_MINOR + 1))"

          if [[ "$BETA_MAJOR" != "$EXPECTED_MAJOR" ||
                "$BETA_MINOR" != "$EXPECTED_MINOR" ]]; then
            echo "::error::Beta version $BETA_VERSION is not the next minor version after master GA $MASTER_VERSION."
            echo "::error::Expected: ${EXPECTED_MAJOR}.${EXPECTED_MINOR}.0bN"
            exit 1
          fi

          echo "Beta version $BETA_VERSION is the next minor version after master GA $MASTER_VERSION."

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: "Build package"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}b${BASH_REMATCH[2]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          python -m build

      - name: "Publish package"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish PR Preview
  #
  # Tag:
  #   v4.3.0a69.1
  #   v4.3.0a69.2
  #
  # Python package version:
  #   4.3.0a69.post1
  #   4.3.0a69.post2
  #
  # Where:
  #   4.3.0 = latest GA version on master
  #   69    = PR number
  #   1 / 2 = preview iteration
  #
  # The PR Preview version MUST match the latest GA version on master.
  # The PR must be based on the current master.
  # ---------------------------------------------------------------------------

  publish-preview:
    name: "Publish PR Preview"
    runs-on: ubuntu-latest
    needs: [pyright, build]

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, 'a')

    steps:
      - name: "Validate PR Preview tag"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+a[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid PR Preview tag: $TAG"
            echo "Expected format: vX.Y.ZaPR_NUMBER.ITERATION"
            exit 1
          fi

          echo "Valid PR Preview tag: $TAG"

      - name: "Extract PR number"
        id: pr
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          PR_NUMBER=$(echo "$TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+a([0-9]+)\.[0-9]+$/\1/')
          ITERATION=$(echo "$TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+a[0-9]+\.([0-9]+)$/\1/')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "iteration=$ITERATION" >> "$GITHUB_OUTPUT"

          echo "PR number: $PR_NUMBER"
          echo "Iteration: $ITERATION"

      - name: "Checkout merged PR head"
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          fetch-depth: 0

      - name: "Validate PR is based on current master"
        shell: bash
        run: |
          git fetch origin master

          CURRENT_MASTER=$(git rev-parse origin/master)
          MERGE_PARENT=$(git rev-parse HEAD^1)

          echo "Current master: $CURRENT_MASTER"
          echo "Merge parent:   $MERGE_PARENT"

          if [[ "$MERGE_PARENT" != "$CURRENT_MASTER" ]]; then
            echo "::error::PR Preview is not based on the current master."
            exit 1
          fi

          echo "PR Preview is based on master."

      - name: "Validate preview version"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin master --tags

          MASTER_VERSION=$(
            git tag --merged origin/master --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 |
            sed 's/^v//'
          )

          PREVIEW_VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)a[0-9]+\.[0-9]+$/\1/')

          echo "Master GA version: $MASTER_VERSION"
          echo "Preview version:   $PREVIEW_VERSION"

          if [[ -z "$MASTER_VERSION" ]]; then
            echo "::error::Could not determine the latest GA version on master."
            exit 1
          fi

          if [[ "$PREVIEW_VERSION" != "$MASTER_VERSION" ]]; then
            echo "::error::PR Preview version $PREVIEW_VERSION does not match current master GA version $MASTER_VERSION."
            exit 1
          fi

          echo "PR Preview version matches current master GA version: $MASTER_VERSION"

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip

          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION:-not-set}"

          pip install -e ".[dev]"
          python -m pip install build

      - name: "Run flake8"
        run: |
          flake8 .

      - name: "Test Pytest"
        run: |
          pytest --junitxml=junit/test-results-preview.xml

      - name: "Upload pytest test results"
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-preview
          path: junit/test-results-preview.xml
        if: ${{ always() }}

      - name: "Build package"
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)\.([0-9]+)$ ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${BASH_REMATCH[1]}a${BASH_REMATCH[2]}.post${BASH_REMATCH[3]}"
          fi

          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION}"

          python -m build

      - name: "Publish package"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
